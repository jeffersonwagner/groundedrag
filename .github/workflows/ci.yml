name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # Deliberately not --all-extras: sentence-transformers pulls in a
        # multi-GB PyTorch/CUDA download, and pgvector/qdrant have no live
        # backend in this CI. Those paths are covered by mocked unit tests
        # instead — see docs/architecture.md.
        run: >
          uv sync --python ${{ matrix.python-version }}
          --extra dev --extra anthropic --extra openai --extra ollama
          --extra chroma --extra pdf

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src/groundedrag

      - name: Run tests
        # Includes the example scripts (tests/test_examples.py); the live
        # provider smoke tests (test_providers_live.py) skip themselves —
        # no vendor credentials are configured in this CI.
        run: uv run pytest --cov=groundedrag --cov-report=term-missing

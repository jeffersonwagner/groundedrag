[project]
name = "groundedrag"
version = "0.1.0"
description = "A hard documentary gate and citation verifier for RAG pipelines — stops the LLM from answering without evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Jefferson Wagner" }]
keywords = ["rag", "llm", "hallucination", "retrieval", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.6", "typer>=0.13", "pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
ollama = ["ollama>=0.4"]
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
qdrant = ["qdrant-client>=1.11"]
sentence-transformers = ["sentence-transformers>=3.0"]
pdf = ["pypdf>=5.0"]
ocr = ["pytesseract>=0.3", "pdf2image>=1.17", "pillow>=10.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
docs = ["mkdocs-material>=9.5"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "fpdf2>=2.7",
]

[project.scripts]
groundedrag = "groundedrag.cli:app"

[project.urls]
Homepage = "https://github.com/jeffersonwagner/groundedrag"
Issues = "https://github.com/jeffersonwagner/groundedrag/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundedrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# No pinned python_version: CI runs mypy under 3.11/3.12/3.13, and pinning
# this to the lowest one made mypy parse a newer numpy's stub file (a
# transitive Chroma dependency, not imported directly) using pre-3.12
# syntax rules, hard syntax-erroring on numpy's PEP 695 `type` statement.
# Leaving it unset makes mypy default to the interpreter actually running
# it, which always matches whatever numpy version was resolved for it.
packages = ["groundedrag"]
ignore_missing_imports = true
